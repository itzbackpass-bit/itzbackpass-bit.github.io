<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Northline - Admin</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#f4f6f8}
.header{background:#0a1a2f;color:white;padding:16px 20px;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:20px;font-weight:800}.logo span{color:#ffcc00}
.box{background:white;max-width:600px;margin:25px auto;padding:22px;border-radius:14px;box-shadow:0 10px 25px rgba(0,0,0,.1)}
h2{margin-bottom:14px}
input,select,textarea{width:100%;padding:12px;border:2px solid #ddd;border-radius:10px;margin-bottom:12px;font-size:15px}
button{width:100%;padding:14px;background:#0a1a2f;color:white;border:none;border-radius:10px;font-size:16px;font-weight:700;cursor:pointer}
button.yellow{background:#ffcc00;color:#111}
label{font-size:13px;font-weight:700;color:#555;display:block;margin-bottom:5px}
.item{background:#f8fafc;border:1px solid #e2e8f0;padding:12px;border-radius:10px;margin-bottom:10px;font-size:14px}
.hidden{display:none}
.top-link{color:white;text-decoration:none;font-size:13px}
</style>
</head>
<body>
<div class="header"><div class="logo">NORTH<span>LINE</span> ADMIN</div><a class="top-link" href="index.html">View Site →</a></div>
<div class="box" id="loginBox">
<h2>Admin Login</h2>
<label>Username</label><input id="u" placeholder="Username">
<label>Password</label><input id="p" type="password" placeholder="Password">
<button onclick="login()">LOGIN</button>
</div>
<div class="box hidden" id="dashBox">
<h2>Create New Shipment</h2>
<label>Tracking Number</label><input id="track" placeholder="e.g. NL123456" style="text-transform:uppercase">
<label>Sender Name</label><input id="sender" placeholder="Sender name">
<label>Receiver Name</label><input id="receiver" placeholder="Receiver name">
<label>From / To</label><input id="route" placeholder="e.g. Pago Pago to Apia">
<label>Status</label><select id="status"><option>Order Received</option><option>Picked Up</option><option>In Transit</option><option>Out for Delivery</option><option>Delivered</option></select>
<label>Current Location / Note</label><textarea id="location" placeholder="e.g. Package at Northline Hub"></textarea>
<button class="yellow" onclick="saveShipment()">CREATE / UPDATE SHIPMENT →</button>
<button onclick="logout()" style="background:#e2e8f0;color:#111;margin-top:10px">Logout</button>
<h2 style="margin-top:25px">All Shipments</h2>
<div id="list">Loading...</div>
</div>
<script>
const API = "https://api.npoint.io/86e424f67e26c73cb9c6";
const ADMIN_USER = "admin";
const ADMIN_PASS = "Northline2026!";
function login(){
  if(document.getElementById('u').value===ADMIN_USER && document.getElementById('p').value===ADMIN_PASS){
    document.getElementById('loginBox').classList.add('hidden');
    document.getElementById('dashBox').classList.remove('hidden');
    showList();
  } else alert('Wrong username or password');
}
function logout(){ location.reload(); }
async function getData(){
  try{ let r=await fetch(API); let j=await r.json(); return j.shipments||{}; }catch(e){ return {}; }
}
async function saveData(shipments){
  await fetch(API, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({shipments: shipments})});
}
async function saveShipment(){
  var t=document.getElementById('track').value.trim().toUpperCase();
  if(!t){ alert('Enter tracking number'); return; }
  let data=await getData();
  data[t]={sender:document.getElementById('sender').value, receiver:document.getElementById('receiver').value, route:document.getElementById('route').value, status:document.getElementById('status').value, location:document.getElementById('location').value, updated:new Date().toLocaleString()};
  await saveData(data);
  alert('Saved ONLINE! Customer can now track: '+t);
  showList();
}
async function showList(){
  let data=await getData();
  let html=''; let keys=Object.keys(data);
  if(keys.length===0) html='<p style="color:#888">No shipments yet.</p>';
  keys.forEach(function(k){ let s=data[k]; html+='<div class="item"><b>'+k+'</b> - '+s.status+'<br>'+s.sender+' → '+s.receiver+'<br>'+s.route+'<br><small>'+s.location+' | '+s.updated+'</small><br><button onclick="delShip(\''+k+'\')" style="padding:6px;margin-top:8px;background:#fee2e2;color:#991b1b;font-size:13px">Delete</button></div>'; });
  document.getElementById('list').innerHTML=html;
}
async function delShip(k){
  if(!confirm('Delete '+k+'?')) return;
  let data=await getData(); delete data[k]; await saveData(data); showList();
}
</script>
</body>
</html>
