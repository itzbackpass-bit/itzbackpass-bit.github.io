<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Northline Owner Dashboard</title>
<style>body{font-family:Arial;background:#f6f7f9;padding:20px}header{background:#0A1931;color:#fff;padding:18px;border-radius:12px}header b{font-size:22px}header b span{color:#FFC107}.card{background:#fff;padding:18px;border-radius:12px;margin-top:15px;box-shadow:0 4px 12px rgba(0,0,0,.07)}input,select{width:100%;padding:11px;margin:6px 0;border:1px solid #ddd;border-radius:8px}.btn{background:#FFC107;border:none;padding:12px;border-radius:8px;font-weight:bold;width:100%;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}.num{font-size:28px;font-weight:bold}</style></head>
<body><header><b>NORTHLINE<span> ✦</span> Owner Dashboard</b><p style="opacity:.8">New York • Manage Your Agency</p></header>
<div class="grid"><div class="card"><div>Today Orders</div><div class="num" id="c1">12</div></div><div class="card"><div>Revenue Today</div><div class="num">$486</div></div><div class="card"><div>Active Drivers</div><div class="num">8</div></div><div class="card"><div>Rating</div><div class="num">4.9 ★</div></div></div>
<div class="card"><h3>Add New Order</h3><input id="cust" placeholder="Customer Name"><input id="from" placeholder="Pickup - e.g. Brooklyn"><input id="to" placeholder="Delivery - e.g. Manhattan"><select id="st"><option>Picked Up</option><option>In Transit</option><option>Out for Delivery</option><option>Delivered</option></select><button class="btn" onclick="add()">Save Order</button><div id="list" style="margin-top:15px"></div></div>
<div class="card"><h3>Agency Settings (Buyer fit change)</h3><input value="Northline Delivery Agency"><input value="(212) 555-0148"><input value="hello@northline-ny.com"><input value="350 5th Avenue, New York, NY 10118"><button class="btn">Save Settings</button><p style="font-size:12px;color:#666;margin-top:8px">Demo dashboard - connect to your WhatsApp / Email to receive real orders.</p></div>
<script>let orders=JSON.parse(localStorage.getItem('nl_orders')||'[]');function render(){document.getElementById('list').innerHTML=orders.map((o,i)=>`<div style="border-bottom:1px solid #eee;padding:10px 0"><b>${o.cust}</b> - ${o.from} → ${o.to} <br><span style="background:#e8f5e9;padding:3px 8px;border-radius:12px;font-size:12px">${o.st}</span> <button onclick="del(${i})" style="float:right">Delete</button></div>`).join('')||'No orders yet. Add one above.';document.getElementById('c1').innerText=orders.length+12}function add(){let o={cust:document.getElementById('cust').value,from:document.getElementById('from').value,to:document.getElementById('to').value,st:document.getElementById('st').value};if(!o.cust)return alert('Enter customer name');orders.unshift(o);localStorage.setItem('nl_orders',JSON.stringify(orders));render();alert('Order saved!')}function del(i){orders.splice(i,1);localStorage.setItem('nl_orders',JSON.stringify(orders));render()}render()</script></body></html>
