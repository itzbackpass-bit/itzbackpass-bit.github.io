<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Northline Admin</title>
<style>body{font-family:Arial;background:#0A1931;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0;padding:20px}.box{background:#fff;padding:25px;border-radius:14px;width:100%;max-width:380px;text-align:center}h2{color:#0A1931}h2 span{color:#FFC107}input{width:100%;padding:12px;margin:8px 0;border:1px solid #ddd;border-radius:8px;box-sizing:border-box}.btn{background:#FFC107;border:none;padding:12px;border-radius:8px;font-weight:bold;width:100%;cursor:pointer}#panel{display:none;text-align:left}.order{background:#f6f7f9;padding:12px;border-radius:8px;margin-top:10px}</style></head>
<body><div class="box">
<div id="login"><h2>NORTHLINE<span> ✦</span> ADMIN</h2><p style="color:#666">Login to manage orders</p><input id="u" placeholder="Username" value="admin"><input id="p" type="password" placeholder="Password" value="1234"><button class="btn" onclick="login()">Login</button><p style="font-size:12px;color:#888">Username: admin | Password: 1234</p></div>
<div id="panel"><h3>Welcome Admin 👋</h3><p>Total Orders: <b id="total">12</b></p><div id="list"><div class="order"><b>James K.</b><br>Brooklyn → Manhattan<br><small>In Transit</small></div><div class="order"><b>Maria S.</b><br>Queens → Bronx<br><small>Delivered</small></div><div class="order"><b>David L.</b><br>New York → New Jersey<br><small>Picked Up</small></div></div><button class="btn" onclick="location.reload()">Logout</button><br><br><a href="owner.html">Go to Owner Dashboard →</a></div>
</div><script>function login(){var u=document.getElementById('u').value.trim();var p=document.getElementById('p').value.trim();if(u=='admin' && p=='1234'){document.getElementById('login').style.display='none';document.getElementById('panel').style.display='block';}else{alert('Use admin / 1234 - I don put am for you already, just press Login');}}</script></body></html>
