<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Northline Admin</title>
<style>
body{font-family:Arial;background:#0f172a;color:#fff;padding:20px;margin:0}
.card{background:#fff;color:#111;padding:20px;border-radius:12px;max-width:500px;margin:20px auto}
input,select{width:100%;padding:12px;margin:8px 0;border:1px solid #ddd;border-radius:8px;box-sizing:border-box}
button{width:100%;padding:12px;background:#2563eb;color:#fff;border:none;border-radius:8px;font-weight:bold;cursor:pointer;margin-top:8px}
.result{background:#f0fdf4;border:1px solid #bbf7d0;padding:14px;border-radius:8px;margin-top:12px;word-break:break-all}
h2{text-align:center}
</style>
</head>
<body>
<h2>🚚 Northline Admin</h2>

<div class="card" id="loginBox">
<h3>Admin Login</h3>
<input type="password" id="pass" placeholder="Enter Password">
<button onclick="login()">Login</button>
<p id="loginMsg" style="color:red"></p>
</div>

<div class="card" id="dashBox" style="display:none">
<h3>Create Tracking Number</h3>
<input id="cName" placeholder="Customer Name e.g. John Doe">
<input id="cFrom" placeholder="From e.g. Houston, Texas">
<input id="cTo" placeholder="To e.g. California">
<select id="cStatus">
<option>In Transit</option>
<option>Picked Up</option>
<option>Out for Delivery</option>
<option>Delivered</option>
</select>
<input id="cLoc" placeholder="Current Location e.g. Dallas, Texas">
<button onclick="createTrack()">Create Tracking Number</button>
<div id="out" class="result" style="display:none"></div>
<button onclick="copyLink()" style="background:#25D366">Copy Customer Link</button>
<p style="font-size:12px;color:#666">Send the link to customer on WhatsApp. When customer opens it, e go see him package details.</p>
</div>

<script>
var PASSWORD = "CALleaf677";
var lastLink = "";
function login(){
  var p = document.getElementById('pass').value;
  if(p === PASSWORD){
    document.getElementById('loginBox').style.display='none';
    document.getElementById('dashBox').style.display='block';
  } else {
    document.getElementById('loginMsg').innerHTML = "Wrong password!";
  }
}
function createTrack(){
  var name = document.getElementById('cName').value.trim();
  var from = document.getElementById('cFrom').value.trim();
  var to = document.getElementById('cTo').value.trim();
  var status = document.getElementById('cStatus').value;
  var loc = document.getElementById('cLoc').value.trim();
  if(!name || !to){ alert("Enter customer name and To"); return; }
  var num = "NL" + Math.floor(100000 + Math.random()*900000);
  var data = {n:num, name:name, from:from, to:to, status:status, loc:loc};
  var encoded = btoa(JSON.stringify(data));
  lastLink = "https://itzbackpass-bit.github.io/?t=" + encoded;
  var o = document.getElementById('out');
  o.style.display='block';
  o.innerHTML = "<b>✅ Tracking Created!</b><br><br><b>Tracking:</b> " + num + "<br><b>Customer:</b> " + name + "<br><b>From:</b> " + from + "<br><b>To:</b> " + to + "<br><b>Status:</b> " + status + "<br><br><b>Customer Link:</b><br>" + lastLink;
  // also save for your phone
  localStorage.setItem(num, JSON.stringify(data));
}
function copyLink(){
  if(!lastLink){ alert("Create tracking first"); return; }
  navigator.clipboard.writeText(lastLink);
  alert("Link copied! Send am to customer");
}
</script>
</body>
</html>
